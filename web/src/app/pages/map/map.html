<h1>Karte</h1>
<app-data-gate>
  <app-global-filter />
  <form class="filters" aria-label="Orte filtern" (submit)="$event.preventDefault()">
    <label>
      Veranstalter:in
      <select id="filter-organizer" (change)="update({ organizer: value($event) || undefined })">
        <option value="" [selected]="!filter().organizer">Alle</option>
        @for (organizer of data.organizers(); track organizer.id) {
          <option [value]="organizer.id" [selected]="filter().organizer === organizer.id">{{ organizer.name }}</option>
        }
      </select>
    </label>
    <label>
      Festival
      <select id="filter-festival" (change)="update({ festival: value($event) || undefined })">
        <option value="" [selected]="!filter().festival">Alle</option>
        @for (festival of data.festivals(); track festival.id) {
          <option [value]="festival.id" [selected]="filter().festival === festival.id">{{ festival.title }}</option>
        }
      </select>
    </label>
    @if (hasUrlFilter()) {
      <button type="button" (click)="resetUrlFilter()">Veranstalter und Festival zurücksetzen</button>
    }
  </form>

  <div class="map-info">
    <p role="status" class="meta">{{ venues().length }} {{ venues().length === 1 ? 'Ort' : 'Orte' }}</p>
    <a class="list-link" routerLink="/venues" [queryParams]="listParams()">Orte als Liste anzeigen</a>
  </div>

  @if (venues().length === 0) {
    <div class="notice">
      <p>Zu diesen Filtern gibt es keinen Ort.</p>
      <button type="button" (click)="resetAll()">Alle Filter zurücksetzen</button>
    </div>
  }

  <section class="map-section" aria-labelledby="map-heading">
    <h2 id="map-heading" class="visually-hidden">Karte</h2>
    <app-venue-legend />
    <app-venue-map [venues]="venues()" />
  </section>
</app-data-gate>
