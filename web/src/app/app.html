<a class="skip-link" href="#inhalt">Zum Inhalt springen</a>
<header class="site-header">
  <a class="brand" routerLink="/"><img class="brand-mark" src="favicon-96x96.png" alt="" aria-hidden="true" width="32" height="32" />Zentrum für praktische Fotografie</a>
  <button
    #menuButton
    type="button"
    class="nav-toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="main-nav"
    [attr.aria-label]="menuOpen() ? 'Menü schließen' : 'Menü öffnen'"
  >
    <span class="nav-toggle-icon" aria-hidden="true"></span>
  </button>
  <nav id="main-nav" class="main-nav" [class.open]="menuOpen()" aria-label="Hauptnavigation">
    <ul>
      @for (link of links; track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.exact }" (click)="closeMenu()">{{
            link.label
          }}</a>
        </li>
      }
    </ul>
  </nav>
</header>
<main id="inhalt" tabindex="-1">
  <router-outlet />
</main>
<footer class="site-footer">
  <div class="footer-inner">
    <nav class="footer-links" aria-label="Rechtliches">
      <a routerLink="/impressum">Impressum</a>
      <a routerLink="/haftungsausschluss">Haftungsausschluss</a>
      <a routerLink="/datenschutz">Datenschutz</a>
      <a routerLink="/quellen">Quellen &amp; Lizenzen</a>
    </nav>
    <p class="muted">Zentrum für Praktische Fotografie · Fokus NRW</p>
  </div>
</footer>
