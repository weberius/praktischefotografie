name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_HREF: /${{ github.event.repository.name }}/
  SITE_URL: https://${{ github.repository_owner }}.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Daten prüfen (Root)
        run: |
          npm ci
          npm run lint
          npm test
      - name: Webanwendung prüfen und bauen
        working-directory: web
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm ci
          npm run lint
          npm test
          npm run build -- --base-href "$BASE_HREF"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
